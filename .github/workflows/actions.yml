name: python ci
on: [push]
jobs:
  steps:
    - name: chekout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.13

    - name: Install dependencies
      run: |
          pip install -r requirements.txt

    - run: python main



