name: python ci
on: [push]
permissions: 
  contents: read
  packages: write
jobs:
  docker: 
    runs-on: ubuntu-latest

    steps:
    - name: chekout
      uses: actions/checkout@v4

    - name: .env
      run: |
        cat > .env <<EOF
        APP_MODE=${{ secrets.APP_MODE }}
        IP_API_URL=${{ secrets.IP_API_URL}}
        WEATHER_API_URL=${{ secrets.WEATHER_API_URL}}
        WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY}}
        EOF

    - name: login to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{ secrets.GITHUB_TOKEN}}

 
    - name: login to acr
      uses: azure/docker-login@v2
      with:
          login-server: weather1.azurecr.io
          username: ${{ secrets.ACR_USER_NAME}}
          password: ${{ secrets.ACR_PASSWORD}}



    - run: |
        docker pull weather1.azurecr.io/private/image:latest
        docker pull private/image:latest